<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f6f8" />
    <meta
      name="description"
      content="healthy 个人健康中心：查看 Garmin 身体数据、睡眠、恢复与运动趋势，记录生活，并通过健康对话理解变化。"
    />
    <title>healthy · 个人健康中心</title>
    <meta name="application-name" content="healthy" />
    <meta name="apple-mobile-web-app-title" content="healthy" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=20261029-chat-stream-style" />
    <script src="./scrollbars.js?v=20261026-scrollbars1" defer></script>
    <script src="./vendor/markdown-it.min.js" defer></script>
    <link rel="stylesheet" href="./recipes.css?v=20261018-unity1" />
    <script src="./recipes.js?v=20261021-share1" defer></script>
    <link rel="stylesheet" href="./training-calendar.css?v=20261018-chat1" />
    <script src="./training-calendar.js?v=20261021-share1" defer></script>
    <link rel="stylesheet" href="./meals.css?v=20261108-photo1" />
    <script src="./nutrition-reference.js?v=20261016-3" defer></script>
    <script src="./meals.js?v=20261108-photo1" defer></script>
    <link rel="stylesheet" href="./reports.css?v=20261018-chat1" />
    <script src="./reports.js?v=20261021-share1" defer></script>
    <link rel="stylesheet" href="./share.css?v=20261021-share1" />
    <script src="./vendor/html-to-image.min.js" defer></script>
    <script src="./share.js?v=20261109-chartjs1" defer></script>
    <link rel="stylesheet" href="./activities.css?v=20261025-1" />
    <script src="./activities.js?v=20261025-1" defer></script>
    <link rel="stylesheet" href="./body-status.css?v=20261110-bsv5" />
    <script src="./body-status.js?v=20261110-bsv5" defer></script>
    <link rel="stylesheet" href="./feedback.css?v=20261027-status-colors" />
    <script src="./feedback.js?v=20261027-status-colors" defer></script>
    <link rel="stylesheet" href="./home-dashboard.css?v=20261028-cockpit4" />
    <script src="./home-dashboard.js?v=20261028-cockpit4" defer></script>
    <link rel="stylesheet" href="./memory.css?v=20261029-1" />
    <script src="./memory.js?v=20261029-1" defer></script>
    <script src="./vendor/chart.umd.min.js?v=4.6.1" defer></script>
    <script src="./app.js?v=20261109-chartjs1" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#app-main">跳到主要内容</a>
    <div class="shell" id="page-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#home" aria-label="healthy 首页"
          ><img class="brand-mark" src="./assets/brand/healthy.svg" width="39" height="39" alt="" />
          <span>healthy<small>PERSONAL HEALTH</small></span></a
        >
        <nav class="side-nav" id="side-nav" aria-label="页面"></nav>
        <div class="sidebar-bottom">
          <div class="side-profile">
            <span class="avatar">我</span
            ><span
              ><strong>我的健康空间</strong
              ><small>每一天，都更了解自己</small></span
            >
          </div>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="workspace-label">
            <a class="mobile-brand" href="#home" aria-label="healthy 首页"><img src="./assets/brand/healthy.svg" width="30" height="30" alt="" /></a
            ><nav id="breadcrumbs" class="breadcrumbs" aria-label="面包屑导航"></nav
            >
          </div>
          <div class="topbar-actions">
            <div id="sync-state" class="sync-state" role="status"></div>
            <button
              id="theme-toggle"
              class="icon-button"
              type="button"
              aria-label="切换深色主题"
              title="切换主题"
            ></button
            ><button
              class="icon-button"
              type="button"
              data-refresh
              aria-label="刷新 Garmin 数据"
              title="刷新 Garmin 数据"
              id="refresh-button"
            ></button>
          </div>
        </header>
        <main id="app-main" tabindex="-1"></main>
        <footer class="page-footer">
          <span>healthy · 记录身体，也关照生活</span
          ><span>身体与运动数据来自 Garmin Connect</span>
        </footer>
      </div>
      <nav class="mobile-nav" id="mobile-nav" aria-label="手机导航"></nav>
      <button
        class="chat-launcher"
        id="chat-launcher"
        type="button"
        data-chat-open
        aria-label="打开健康对话"
        title="打开健康对话"
        aria-controls="companion"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5 8.2 8.2 0 0 1-3-.6L4 20l1.6-4.5A7.5 7.5 0 1 1 20 11.5Z"/><path d="M9 11.5h.01M12.5 11.5h.01M16 11.5h.01" stroke-width="2.5"/></svg>
      </button>
    </div>
    <div class="overlay-backdrop" id="overlay-backdrop" hidden></div>
    <aside
      class="companion"
      id="companion"
      role="dialog"
      aria-modal="true"
      aria-label="健康对话"
      aria-hidden="true"
      tabindex="-1"
      inert
    ></aside>
    <aside
      class="metric-drawer"
      id="metric-drawer"
      role="dialog"
      aria-modal="true"
      aria-label="指标详情"
      aria-hidden="true"
      tabindex="-1"
      inert
    ></aside>
    <dialog class="meal-photo-viewer" id="meal-photo-viewer" aria-label="餐食照片">
      <div class="meal-photo-viewer-bar">
        <span class="meal-photo-viewer-count" data-photo-count aria-live="polite"></span>
        <div class="meal-photo-viewer-actions">
          <button type="button" class="icon-button" data-photo-zoom aria-label="放大照片" title="放大照片" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6m-3-3v6"/></svg>
          </button>
          <button type="button" class="icon-button" data-photo-close aria-label="关闭照片查看" title="关闭照片查看">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
          </button>
        </div>
      </div>
      <div class="meal-photo-viewer-stage">
        <div class="meal-photo-viewer-track" data-photo-track tabindex="0" aria-label="左右滑动查看多张照片"></div>
        <button type="button" class="meal-photo-viewer-nav is-prev" data-photo-prev aria-label="上一张照片" hidden>‹</button>
        <button type="button" class="meal-photo-viewer-nav is-next" data-photo-next aria-label="下一张照片" hidden>›</button>
      </div>
    </dialog>
  </body>
</html>
