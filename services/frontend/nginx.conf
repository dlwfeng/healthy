server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-3I2nGEHja0tMbJ16dbpuPOupSAv7DBH8QKErJY4u7dQ='; frame-src 'self' about:; font-src 'self'; base-uri 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8060;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_set_header Host 127.0.0.1:8060;
        # The API accepts only its loopback origin. This fixed header is set by
        # the local-only frontend proxy; browser input cannot override it.
        proxy_set_header Origin http://127.0.0.1:8060;
        proxy_set_header X-Forwarded-For "";
    }
}
